<div class="relative z-10">
<!-- Branding -->

<div class="mb-md">

                        Hybrid Edge AI <br>

</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-sm">Clinical Grade Neurological Surveillance</p>

<!-- Form -->
<form class="space-y-lg" onsubmit="return false;">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none login-transition" id="username" name="username" placeholder="Enter your ID or email" type="text">
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none login-transition" id="password" name="password" placeholder="••••••••" type="password">
</div>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center space-x-sm cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/20 cursor-pointer" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="font-body-sm text-body-sm text-primary hover:text-surface-tint font-semibold transition-colors" href="index.html">Forgot Password?</a>
</div>
<a href="index.html" class="w-full py-md bg-primary text-on-primary font-title-sm text-title-sm rounded-lg hover:bg-surface-tint active:scale-[0.98] transition-all shadow-md hover:shadow-lg flex items-center justify-center space-x-sm">
<span class="">Login to Dashboard</span>
<span class="material-symbols-outlined">arrow_forward</span>
</a>
</form>
<!-- Footer Info -->
<div class="mt-xl pt-lg border-t border-outline-variant flex items-center justify-between">
<div class="flex items-center space-x-sm">
<div class="w-2 h-2 bg-secondary rounded-full animate-pulse"></div>

<div class="bg-white/50 p-sm rounded border border-white/30">

<div class="flex space-x-sm">

<script>
        // Micro-interaction for input focus effects
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#004ac6';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#737686';
            });
        });

        // Simple button active state visual feedback
        const submitBtn = document.querySelector('button[type="submit"]');
        submitBtn.addEventListener('click', function() {
            this.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="ml-2">Authenticating...</span>
            `;
            setTimeout(() => {
                this.innerHTML = `<span>Login to Dashboard</span><span class="material-symbols-outlined ml-2">arrow_forward</span>`;
            }, 2000);
        });
    </script>
